name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: winchtest
          POSTGRES_DB: winch_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poppler-utils (pdftoppm — required by winch.media)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install dependencies
        run: pip install --no-cache-dir '.[dev]'

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:winchtest@localhost:55432/winch_test
        run: pytest tests/ -q
