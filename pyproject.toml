[project]
name = "winch"
version = "0.1.0"
description = "LangGraph agent that recovers dormant high-ticket trade quotes via WhatsApp, with strict human-in-the-loop."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "pydantic>=2.9",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "anthropic[bedrock]>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "reportlab>=4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
